<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT IG — Instagram Intelligence &amp; Investigation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles/theme.css" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Navigation -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <i data-lucide="panel-left"></i>
        </button>
        <div class="brand-lockup" data-nav="dashboard">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
              <rect x="2" y="2" width="32" height="32" rx="8" fill="#EFF6FF" stroke="#155EEF" stroke-width="2"/>
              <rect x="8" y="8" width="20" height="20" rx="5.5" stroke="#155EEF" stroke-width="1.8"/>
              <circle cx="18" cy="18" r="4.5" stroke="#155EEF" stroke-width="1.8"/>
              <circle cx="24" cy="12" r="1.3" fill="#155EEF"/>
              <path d="M18 5V8M18 28V31M5 18H8M28 18H31" stroke="#155EEF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="brand-title-row">
              <span class="brand-name">OSINT IG</span>
              <span id="versionBadge" class="version-pill">v1.0</span>
            </div>
            <div class="brand-tagline">Instagram Intelligence &amp; Investigation Platform</div>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <div id="globalIgStatus" class="status-chip status-muted" title="Instagram Data Provider Status">
          <span class="status-dot"></span>
          <span class="status-text">Checking session...</span>
        </div>
        <div id="globalAiStatus" class="status-chip status-muted" title="Optional Gemini AI Status">
          <i data-lucide="sparkles"></i>
          <span class="status-text">AI Optional</span>
        </div>
        <button id="themeToggleBtn" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
          <i data-lucide="moon"></i>
        </button>
        <button class="btn btn-ghost btn-sm" data-nav="about">
          <i data-lucide="help-circle"></i>
          <span>Help / About</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- Left Sidebar -->
      <aside id="sidebar" class="sidebar">
        <nav class="sidebar-nav" aria-label="Primary navigation">
          <div class="nav-group-label">Overview</div>
          <button class="nav-item active" data-nav="dashboard">
            <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
          </button>
          <button class="nav-item" data-nav="investigate">
            <i data-lucide="search"></i><span>New Investigation</span>
          </button>

          <div class="nav-group-label">Intelligence Modules</div>
          <button class="nav-item" data-nav="module-profile">
            <i data-lucide="user-check"></i><span>Profile Intelligence</span>
          </button>
          <button class="nav-item" data-nav="module-network">
            <i data-lucide="users"></i><span>Followers &amp; Following</span>
          </button>
          <button class="nav-item" data-nav="module-content">
            <i data-lucide="hash"></i><span>Hashtag Intelligence</span>
          </button>
          <button class="nav-item" data-nav="module-media">
            <i data-lucide="image"></i><span>Media Intelligence</span>
          </button>
          <button class="nav-item" data-nav="module-location">
            <i data-lucide="map-pin"></i><span>Location Intelligence</span>
          </button>

          <div class="nav-group-label">Records &amp; Output</div>
          <button class="nav-item" data-nav="saved">
            <i data-lucide="folder-archive"></i><span>Saved Investigations</span>
          </button>
          <button class="nav-item" data-nav="history">
            <i data-lucide="history"></i><span>Investigation History</span>
          </button>
          <button class="nav-item" data-nav="reports">
            <i data-lucide="file-text"></i><span>Reports &amp; Exports</span>
          </button>

          <div class="nav-group-label">System</div>
          <button class="nav-item" data-nav="settings">
            <i data-lucide="settings"></i><span>Settings</span>
          </button>
          <button class="nav-item" data-nav="about">
            <i data-lucide="info"></i><span>About OSINT IG</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="csib-card">
            <div class="csib-card-title">Developed by Mohsin Khawaja</div>
            <div class="csib-card-sub">CSIB — Cyber Solutions &amp; Information Board</div>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main id="mainContent" class="main-content">
        <!-- Views are rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
